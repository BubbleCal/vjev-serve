[project]
name = "vjev"
version = "0.1.0"
description = "Typed decisions from text and images in one forward pass: a Jev-style API, a web console, and the inference code for the vjev models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6",
    "transformers>=5.15",
    "huggingface_hub>=0.30",
    "safetensors>=0.4",
    "pillow>=10.4",
    "torchvision>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vjev-serve = "vjev.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vjev"]
